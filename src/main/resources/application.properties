spring.application.name=wardroom
spring.main.banner-mode=off
server.port=8119

# All persistent state lives in this directory (ADR 0009). The container mounts a volume here.
wardroom.data-dir=/config

# The migrations run in Wardroom's own startup sequence (ADR 0004); see DatabaseMigrator.
spring.flyway.locations=classpath:db/migration

# Sessions are stored in the database and end after 30 days without a request (spec 001). The tables are created by
# a migration. The cookie is kept for 400 days, the longest time browsers allow, so that closing the browser does not
# log out; the 30 days are enforced by the server.
spring.session.timeout=30d
spring.session.jdbc.initialize-schema=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.max-age=400d

# X-Forwarded-Proto and related headers are honored only when the request comes from a private-network address
# (ADR 0010). Behind a reverse proxy with TLS, the session cookie then gets the Secure flag.
server.forward-headers-strategy=native

# Only the health endpoint is exposed; the container's HEALTHCHECK uses it.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# The OpenAPI specification and Swagger UI are served in development only (ADR 0027).
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.paths-to-match=/api/**

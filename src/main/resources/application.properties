spring.application.name=wardroom
spring.main.banner-mode=off
server.port=8119

# All persistent state lives in this directory (ADR 0009). The container mounts a volume here.
wardroom.data-dir=/config

# The key for the stored NNTP password is created in the data directory. With this environment variable the owner
# keeps it in a file elsewhere instead (ADR 0025).
wardroom.encryption-key-file=${WARDROOM_ENCRYPTION_KEY_FILE:}

# The migrations run in Wardroom's own startup sequence (ADR 0004); see DatabaseMigrator.
spring.flyway.locations=classpath:db/migration

# Sessions are stored in the database; the tables are created by a migration. Every login sets how long its session
# lasts without a request: 30 minutes, or 7 days with "Remember me" (spec 011); see AuthController. The value here
# applies to sessions that were created before that.
spring.session.timeout=7d
spring.session.jdbc.initialize-schema=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# X-Forwarded-Proto and related headers are honored only when the request comes from a private-network address
# (ADR 0010). Behind a reverse proxy with TLS, the session cookie then gets the Secure flag.
server.forward-headers-strategy=native

# Only the health endpoint is exposed; the container's HEALTHCHECK uses it.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# The OpenAPI specification and Swagger UI are served in development only (ADR 0027).
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.paths-to-match=/api/**

# The group list is fetched when a server is created and on a schedule (ADR 0020). Tests of other features
# switch this off.
wardroom.group-list.automatic-refresh=true

# Subscribed groups are synchronized on a schedule and when a group is subscribed (spec 005). Tests of other
# features switch this off.
wardroom.synchronization.automatic=true

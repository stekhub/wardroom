# Used by @IntegrationTest: every application context gets its own empty data directory.
wardroom.data-dir=target/test-data/${random.uuid}
springdoc.api-docs.enabled=true

# No test gets a group list refresh it did not ask for; the tests of the group list switch it on.
wardroom.group-list.automatic-refresh=false

# No test gets a synchronization it did not ask for; the tests of the synchronization switch it on.
wardroom.synchronization.automatic=false

# Loading and jumping give up quickly when their group is being synchronized.
wardroom.synchronization.load-wait=PT0.1S

name: Release

# A release starts when a version tag such as v0.9.0 is pushed. The workflow tests the tagged
# commit, builds the image for amd64 and arm64 (ADR 0024), checks that it starts and becomes
# healthy on both, publishes it to ghcr.io/stekhub/wardroom and creates the GitHub release.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      # The version in pom.xml must be the version of the tag, without -SNAPSHOT.
      - name: Check the version
        run: |
          project_version="$(./mvnw --batch-mode --quiet help:evaluate -Dexpression=project.version -DforceStdout)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$project_version" != "$tag_version" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but pom.xml has the version $project_version."
            exit 1
          fi

      # Builds the backend and the frontend and runs all tests (ADR 0030).
      - name: Build and test
        run: ./mvnw --batch-mode verify

  image:
    name: Build and publish the image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=Wardroom
            org.opencontainers.image.description=Self-hosted newsreader for NNTP servers, with a web interface.
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      # Each architecture is built on its own and loaded into Docker, so that it can be started.
      # The jar is built once: the build stage runs on the runner's architecture, and later builds
      # take it from the build cache.
      - name: Build the amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: wardroom:test-amd64

      - name: Build the arm64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: wardroom:test-arm64

      # The image must start and pass its health check on both architectures (ADR 0024). The
      # arm64 image runs emulated and starts slowly.
      - name: Check that the images become healthy
        run: |
          for architecture in amd64 arm64; do
            container="wardroom-test-$architecture"
            docker run --detach --name "$container" --platform "linux/$architecture" \
              --tmpfs /config "wardroom:test-$architecture"
            status=starting
            for attempt in $(seq 1 60); do
              status="$(docker inspect --format '{{.State.Health.Status}}' "$container")"
              if [ "$status" = healthy ] || [ "$status" = unhealthy ]; then
                break
              fi
              sleep 10
            done
            echo "$architecture: $status"
            if [ "$status" != healthy ]; then
              docker logs "$container"
              exit 1
            fi
            docker rm --force "$container"
          done

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Provenance is left out: GitHub would list it as an extra platform "unknown/unknown".
      - name: Publish the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            --title "Wardroom $version" \
            --notes "The image is \`$IMAGE:$version\` for amd64 and arm64. See the [user guide](https://github.com/${{ github.repository }}/blob/$GITHUB_REF_NAME/docs/user-guide.md#backups-and-updates) for how to update."
